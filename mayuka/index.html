---
layout: null
---

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>jasgifs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        font-family: 'Poppins', system-ui, Arial, sans-serif;
        color: #111;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .site-header {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 0.5in; /* reduced spacing */
      }
      .site-header h1 {
        font-size: 30px;
        line-height: 1.1;
        margin: 0;
        font-weight: 600;
      }
      .site-header .subtitle {
        font-size: 10px;
        margin: 6px 0 0;
        color: #666;
        font-weight: 300;
      }

      .gif-gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px; /* spacing between GIF items */
        padding: 0;
        margin: 0;
      }

      .gif-item {
        display: block;
        background: #fff;
      }

      .gif-gallery img {
        display: block;
        width: 268px;
        max-width: 100%;
        height: 151px;
        object-fit: contain;
        margin: 0;
        padding: 0;
        border: none;
        background: #fff;
      }

      @media (max-width: 640px) {
        .gif-gallery img {
          width: calc(50% - 12px);
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1>ogou mayuka (niziu)</h1>
        <div class="subtitle">do not edit, redistribute, or use in krp</div>
      </header>

      <div class="gif-gallery">
        {% assign gifs = site.static_files | where_exp: "file", "file.path contains '/mayuka/'" %}
        {% for gif in gifs %}
          {% if gif.extname == ".gif" %}
            <div class="gif-item">
              <img src="{{ gif.path | relative_url }}" alt="{{ gif.name }}">
            </div>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </body>
</html>
