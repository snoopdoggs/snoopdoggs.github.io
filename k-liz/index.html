---
layout: null
---

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jasgifs</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        font-family: 'Montserrat', system-ui, Arial, sans-serif;
        color: #111;
      }

      .container {
        max-width: 1700px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .site-header {
        text-align: center;
        margin-top: 40px;
        margin-bottom: 24px;
      }
      .site-header h1 {
        font-family: 'Montserrat', system-ui, Arial, sans-serif;
        font-size: 20px;
        line-height: 1.2;
        margin: 0;
        font-weight: 600;
      }
      .site-header .subtitle {
        font-size: 10px;
        margin: 6px 0 0;
        color: #666;
        font-weight: 300;
      }

      .gif-gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 0;
        margin: 0;
      }

      .gif-item {
        display: block;
        flex: 0 0 268px;
        width: 268px;
        background: #fff;
      }

      .gif-gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 268 / 151;
        height: auto;
        object-fit: cover;
        margin: 0;
        padding: 0;
        border: none;
      }

      @media (max-width: 640px) {
        .container { padding: 0 12px; }
        .gif-gallery { gap: 4px; }
        .gif-item { flex: 0 0 calc(50% - 2px); width: calc(50% - 2px); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1>kim  jiwon  /  liz  (  ive  ).</h1>
        <div class="subtitle">do  not  redistribute,  edit,  or  use  in  krp</div>
      </header>

      <div class="gif-gallery">
        {% assign gifs = site.static_files | where_exp: "file", "file.path contains '/k-liz/'" %}
        {% for gif in gifs %}
          {% if gif.extname == ".gif" %}
            <div class="gif-item">
              <img src="{{ gif.path | relative_url }}" alt="{{ gif.name }}">
            </div>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </body>
</html>
